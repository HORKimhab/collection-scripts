# Install:  curl -o ~/.tmux.conf https://raw.githubusercontent.com/HORKimhab/collection-scripts/main/tmux.conf
# Reload:   tmux source-file ~/.tmux.conf
# Usage:    tmux            -> new session split into 4 panes
#           tmux new -s dev -> named session split into 4 panes
#
#   ┌──────────┬──────────┐
#   │ pane 0   │ pane 1   │
#   ├──────────┼──────────┤
#   │ pane 2   │ pane 3   │
#   └──────────┴──────────┘

set -g mouse on
set -s copy-command 'pbcopy'

# Start every new session split into 4 equal panes (2x2 grid)
set-hook -g session-created 'split-window -h; split-window -v; split-window -v; select-layout tiled; select-pane -t :.0'
